<div style="font-family:Inter,Arial,sans-serif;max-width:480px;margin:0 auto;padding:24px">
  <h2 style="margin:0 0 8px;color:#181c32">Reset your HRMS password</h2>
  <p style="color:#5e6278;line-height:1.6">
    Enter this one-time password on the HRMS password-reset screen:
  </p>
  <div style="margin:24px 0;padding:16px;border-radius:8px;background:#f1edfd;color:#5014d0;font-size:28px;font-weight:700;letter-spacing:8px;text-align:center">
    {{ .Token }}
  </div>
  <p style="color:#99a1b7;font-size:12px;line-height:1.5">
    If you did not request a password reset, you can safely ignore this email.
    Never share this code with anyone.
  </p>
</div>
